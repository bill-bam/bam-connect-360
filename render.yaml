services:
  - type: web
    name: bam-connect-360-trial
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CARHUB_API_KEY
        sync: false
      - key: BAM_TRIAL_PIN
        sync: false
      - key: CARHUB_BACKGROUND_ASSET_ID
        value: "01a1f8d3-6dcd-7ba9-ad18-6ece95c24d53"
      - key: BAM_MAX_GENERATIONS
        value: "5"
